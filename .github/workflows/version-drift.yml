name: version-drift

# FORNX-461: the deployed site must show the latest published Fornax release
# and never an unreleased candidate. Deployment is out of band (Cloudflare
# Pages), so this daily job is what notices when production lags main.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/check-version-drift.mjs --live --strict
        env:
          GITHUB_TOKEN: ${{ github.token }}
