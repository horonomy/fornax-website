name = "fornax-edge"
main = "src/index.ts"
compatibility_date = "2026-09-06"

# FORNX-241 (founder-approved architecture decision, 2026-09-19): the
# fornax.horo.run/* route this Worker used to own is released here and
# re-claimed by fornax-cloud/frontend's own Worker, which now serves the
# real Fornax Beta SaaS frontend at that hostname instead of redirecting it
# to fornax.horonom.com. See that repo's frontend/wrangler.jsonc for the
# new owner, and its own comment for why this doesn't need a Custom Domain
# (the Pages custom-domain binding this repo's Worker used to intercept
# ahead of stays attached and untouched).
#
# This Worker (src/index.ts, HORO-572's fornax.horo.run -> fornax.horonom.com
# redirect) is deliberately left deployed but routeless rather than deleted:
# it has no route left to serve, and deleting a live Worker in shared
# Cloudflare infra is a separate, more irreversible action than releasing a
# route. Re-attach a route here only if fornax.horo.run's SaaS deployment is
# ever retired and the redirect needs to come back.
#
# An explicit empty array (not just omitting the key) is required to make
# wrangler actually unassign the previously-deployed route via the API —
# omitting `routes` entirely left the old assignment in place on the first
# attempt at this change (verified live: redeploying with no `routes` key
# did not release "fornax.horo.run/*", confirmed by the next Worker's
# deploy failing with "already assigned to routes").
routes = []
