    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Fornax checks what an AI agent tells you against the evidence of what it actually did — VERIFIED, UNVERIFIED, CONTRADICTED, REVIEW, or UNAVAILABLE. No made-up trust score. Currently supports coding agents (Claude Code, Codex, opencode)."

         of hydration; the noscript link below covers a no-JS visitor too. -->
    <link rel="help" href="https://docs.fornax.horonom.com" />
    <meta property="og:url" content="https://fornax.horonom.com/" />
    <meta property="og:title" content="Fornax — evidence-first agent integrity" />

      property="og:description"
      content="Fornax checks what an AI agent tells you against the evidence of what it actually did — VERIFIED, UNVERIFIED, CONTRADICTED, REVIEW, or UNAVAILABLE. No made-up trust score. Currently supports coding agents (Claude Code, Codex, opencode)."
    />
